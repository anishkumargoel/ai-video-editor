<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Video Editor</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0d12; --panel:#171a21; --line:#292d38; --accent:#ff4d36; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:Arial,sans-serif; background:var(--bg); color:#f5f7fb; }
    form { width:min(400px,calc(100% - 32px)); padding:28px; border:1px solid var(--line); border-radius:12px; background:#11141b; }
    h1 { margin:0 0 4px; font-size:22px; }
    p.sub { margin:0 0 20px; color:#9da7b7; }
    .field { display:grid; gap:7px; margin-bottom:16px; }
    input { width:100%; border:1px solid #46505f; border-radius:7px; padding:11px; background:#0b0d12; color:white; font:inherit; }
    button { width:100%; border:0; border-radius:7px; padding:11px 14px; background:var(--accent); color:white; font:inherit; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    #status { color:#ffb4a9; min-height:1.2em; margin:12px 0 0; }
  </style>
</head>
<body>
  <form id="login-form">
    <h1>Video Editor</h1>
    <p class="sub">Sign in to continue</p>
    <div class="field"><label for="username">Username</label><input id="username" autocomplete="username" required autofocus></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <button id="login-button" type="submit">Log in</button>
    <p id="status"></p>
  </form>
  <script>
    document.getElementById("login-form").onsubmit = async event => {
      event.preventDefault();
      const status = document.getElementById("status");
      const button = document.getElementById("login-button");
      button.disabled = true;
      status.textContent = "";
      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value
          })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) { status.textContent = data.detail || "Login failed"; return; }
        window.location.href = data.role === "admin" ? "/admin/users" : "/";
      } catch (error) {
        status.textContent = "Unable to reach the server";
      } finally {
        button.disabled = false;
      }
    };
  </script>
</body>
</html>
